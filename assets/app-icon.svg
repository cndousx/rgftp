<svg xmlns="http://www.w3.org/2000/svg" viewBox="63 39 450 450" width="512" height="512">
  <defs>
    <linearGradient id="fileFill" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4F9BFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="foldFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Document sheet with a cut corner, not a rounded app tile -->
  <path
    d="M116 56
       H320
       L408 144
       V452
       Q408 464 396 464
       H116
       Q104 464 104 452
       V68
       Q104 56 116 56
       Z"
    fill="url(#fileFill)"/>

  <!-- Folded corner -->
  <path
    d="M320 56
       L408 144
       H332
       Q320 144 320 132
       Z"
    fill="url(#foldFill)"/>

  <!-- Upload arrow -->
  <rect x="177" y="238" width="28" height="160" rx="14" fill="#FFFFFF"/>
  <path d="M191 184 L245 260 H137 Z" fill="#FFFFFF"/>

  <!-- Download arrow -->
  <rect x="287" y="196" width="28" height="152" rx="14" fill="#FFFFFF"/>
  <path d="M301 394 L247 318 H355 Z" fill="#FFFFFF"/>

  <!-- Security shield badge for SFTP -->
  <path
    d="M400 285
       L470 314
       V378
       C470 424 442 452 400 468
       C358 452 330 424 330 378
       V314
       Z"
    fill="url(#shieldFill)"/>

  <!-- Keyhole -->
  <circle cx="400" cy="372" r="17" fill="#FFFFFF"/>
  <path d="M392 382 H408 L402 416 H398 Z" fill="#FFFFFF"/>
</svg>
