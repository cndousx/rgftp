[package]
name = "rgftp"
version = "0.4.0"
edition = "2024"
description = "A small SFTP desktop client built with gpui-kit"
license = "Apache-2.0"

[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dependencies]
async-channel = "2.5"
chrono = "0.4"
dirs = "7"
gpui-kit = "0.9.1"
russh = { version = "0.65", default-features = false, features = [
    "flate2",
    "ring",
    "rsa",
] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
